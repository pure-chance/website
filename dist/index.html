<!DOCTYPE html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>pure-chance</title><meta name="description" content="A record of thoughts by @pure-chance."><link rel="canonical" href="https://pure-chance.xyz/"><link rel="alternate" type="application/rss+xml" title="pure-chance" href="https://pure-chance.xyz/rss.xml"><link rel="icon" type="image/svg+xml" href="/public/favicon.svg"><link rel="stylesheet" href="/styles.css"><style>article {
  margin-top: var(--space-gap);
  margin-bottom: var(--space-gap);
  &:last-of-type {
    margin-bottom: var(--space-block);
  }
}

article a {
  display: flex;
  align-items: baseline;
  text-decoration: none;
}

h2 {
  font: italic normal var(--font-size) var(--font-family-serif);
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /*
   * The very end of the last char gets clipped when the text is

   * avoids this issue.

}

  font-size: var(--font-scale-mono-ui);

}

#feed {
  font-family: var(--font-family-mono);
  font-size: var(--font-scale-mono-ui);

</style><style>/* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,
mtable.left-align mtd.right-align,
mtable.aligned mtd:nth-child(odd) {
  justify-items: end;
  text-align: right;
}
mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {
  justify-items: start;
  text-align: left;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.left-flush {
  padding-left: 0;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.right-flush {
  padding-right: 0;
}

/* Tables */
mtable {
  math-style: inherit;
}
mtd {
  math-depth: auto-add;
  math-style: compact;
  math-shift: compact;
}

/* Equations */
mtable.multiline-equation mtd {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
  padding: 0;
}
math > mtable.multiline-equation mtr:not(:last-child) mtd {
  padding-bottom: 0.5em;
}

/* Fractions */
mfrac {
  padding-inline: 0;
  margin-inline: 0.1em;
}

/* Accents */
mover[accent="true" i] > :first-child {
  font-feature-settings: "dtls";
}
mover.dotted[accent="true" i] > :first-child {
  font-feature-settings: "dtls" 0;
}

/* Other rules for scriptlevel, displaystyle and math-shift */
munder > :nth-child(2),
munderover > :nth-child(2) {
  math-shift: compact
}
munder[accentunder="true" i] > :not(:first-child),
mover[accent="true" i] > :not(:first-child) {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
}</style></head><body><main><article><a href="/ao3-formatting-is-a-nightmare/"><h2>AO3 Formatting is a Nightmare</h2><span class="leader"></span><span style="white-space: pre-wrap">&#x20;</span><time datetime="2026-04-07">2026.04.07</time></a></article><article><a href="/optimally-wrong-wordle/"><h2>Optimally Wrong Wordle</h2><span class="leader"></span><span style="white-space: pre-wrap">&#x20;</span><time datetime="2025-11-06">2025.11.06</time></a></article><article><a href="/iconography-of-an-apocalypse/"><h2>Iconography of an Apocalypse</h2><span class="leader"></span><span style="white-space: pre-wrap">&#x20;</span><time datetime="2024-12-16">2024.12.16</time></a></article><article><a href="/youtube-metacommentary-and-authenticity/"><h2>YouTube Metacommentary and Authenticity</h2><span class="leader"></span><span style="white-space: pre-wrap">&#x20;</span><time datetime="2024-06-06">2024.06.06</time></a></article><p id="feed">RSS feed at <a href="/rss.xml">rss.xml</a></p></main><footer id="running-footer"><span id="label">@pure-chance</span> <a href="/about" class="ref"><sup>†</sup>about</a><a href="/resources" class="ref"><sup>‡</sup>resources</a></footer></body></html>
